name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Build and test
        run: cargo test --workspace

      - name: Python tooling syntax
        run: python3 -m py_compile tools/gen_assets.py tools/gen_sfx.py tools/gen_screenpack.py tools/oracle/parse_match_log.py tools/oracle/run_round_oracle.py
