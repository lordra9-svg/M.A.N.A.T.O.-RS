[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT"
authors = ["M.A.N.A.T.O.-RS contributors"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bitflags = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.17"
hound = "3.5"
cpal = "0.15"
ggrs = "0.13"
wgpu = "25"
winit = "0.30"
pollster = "0.4"
libloading = "0.8"
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
