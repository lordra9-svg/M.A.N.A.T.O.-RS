[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT"
authors = ["M.A.N.A.T.O.-RS contributors"]

[workspace.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
sha2 = "0.10"
glam = "0.29"
gltf = { version = "1", features = ["extensions"] }
mlua = { version = "0.10", features = ["lua54", "vendored"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
toml = "0.8"
bitflags = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.17"
hound = "3.5"
cpal = "0.15"
symphonia = { version = "0.5", features = ["mp3", "ogg", "vorbis", "wav"] }
ggrs = "0.13"
wgpu = { version = "25", features = ["glsl"] }
winit = "0.30"
gilrs = "0.11"
pollster = "0.4"
libloading = "0.8"
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
