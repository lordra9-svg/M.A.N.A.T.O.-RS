[package]
name = "manato-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Event-driven sound mixer and audio output for M.A.N.A.T.O.-RS"

[features]
default = []
# Optional cpal backend. Building this feature requires the ALSA development
# package (`alsa-lib-devel` on Fedora, `libasound2-dev` on Debian/Ubuntu)
# because cpal links against libasound. Linux uses the runtime-loaded
# PulseAudio backend by default instead.
cpal-backend = ["dep:cpal"]

[dependencies]
manato-formats = { path = "../manato-formats" }
manato-sim = { path = "../manato-sim" }
cpal = { workspace = true, optional = true }
anyhow.workspace = true
log.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libloading.workspace = true
